<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глобус Погода — Админ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      padding: 20px;
    }

    .brand {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.8;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }

    .box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    h2 { text-align: center; margin-bottom: 20px; font-weight: 500; }

    input, button {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      outline: none;
    }

    input {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    input::placeholder { color: rgba(255, 255, 255, 0.6); }

    button {
      background: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .hidden { display: none; }

    /* === iOS === */
    body.is-ios .box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 30px;
    }
    body.is-ios input, body.is-ios button { border-radius: 15px; }

    /* === ANDROID === */
    body.is-android .box {
      background: #1e1e1e;
      border-radius: 28px;
      border: none;
    }
    body.is-android button { background: #bb86fc; color: #000; }
  </style>
</head>
<body>

  <!-- Форма входа -->
  <div id="loginBox" class="box">
    <div class="brand">🌍 Глобус Погода</div>
    <h2>Вход для админа</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
  </div>

  <!-- Форма управления -->
  <div id="adminBox" class="box hidden">
    <div class="brand">🌍 Глобус Погода</div>
    <h2>Изменить погоду</h2>
    <form id="weatherForm">
      <input type="text" id="city" placeholder="Город" required>
      <input type="number" id="temp" placeholder="Температура (°C)" required>
      <input type="text" id="condition" placeholder="Описание" required>
      <button type="submit">Сохранить</button>
    </form>
    <button id="logoutBtn" style="background: #dc3545; color: white;">Выйти</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    // Детект ОС
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      document.body.classList.add('is-ios');
    } else if (/android/i.test(userAgent)) {
      document.body.classList.add('is-android');
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAAK27Mb8PFDdOmJOPEZ85eLTKyj58THI0",
      authDomain: "globus-weather.firebaseapp.com",
      projectId: "globus-weather",
      storageBucket: "globus-weather.firebasestorage.app",
      messagingSenderId: "552203862140",
      appId: "1:552203862140:web:c8029fac001fafb97909f9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginBox = document.getElementById('loginBox');
    const adminBox = document.getElementById('adminBox');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBox.classList.add('hidden');
        adminBox.classList.remove('hidden');
      } else {
        loginBox.classList.remove('hidden');
        adminBox.classList.add('hidden');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;

      signInWithEmailAndPassword(auth, email, pass).catch((error) => {
        alert("Ошибка входа: " + error.message);
      });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth);
    });

    document.getElementById('weatherForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const city = document.getElementById('city').value;
      const temp = Number(document.getElementById('temp').value);
      const condition = document.getElementById('condition').value;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // 1. Обновляем текущие данные
      set(ref(db, 'weather'), {
        city: city,
        temp: temp,
        condition: condition
      });

      // 2. Записываем точку в историю для графика
      push(ref(db, 'history'), {
        temp: temp,
        time: time,
        timestamp: Date.now()
      }).then(() => {
        alert('Погода и график успешно обновлены!');
      }).catch((error) => {
        alert('Ошибка: ' + error.message);
      });
    });
  </script>

</body>
</html>
