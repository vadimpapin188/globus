<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon.png">
    <title>Глобус Переводчик</title>
    <style>
      :root {
        --primary-color: #C0C0C0; 
        --secondary-color: #ffffff;
        --background-color: #051937; 
        --sidebar-bg: #1a2a3a;
      }

      * { box-sizing: border-box; }

      body { 
          margin: 0; 
          font-family: Arial, sans-serif; 
          background-color: var(--background-color); 
          color: var(--secondary-color); 
          min-height: 100vh; 
          display: flex;
          flex-direction: column;
      }

      .content-area { 
          flex-grow: 1; 
          width: 100%;
          max-width: 1200px;
          margin: 0 auto;
          padding: 20px;
      }
      
      .top-bar { 
          padding: 20px 0; 
          display: flex; 
          justify-content: space-between; 
          align-items: center; 
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
          margin-bottom: 30px;
      }

      .brand-section h1 { 
          font-size: 36px; 
          color: var(--primary-color); 
          margin: 0; 
      }

      main { display: flex; justify-content: center; }

      .translator-container {
          display: flex;
          flex-direction: column;
          gap: 20px;
          width: 100%;
      }

      .lang-select-bar {
          display: flex;
          align-items: center;
          gap: 15px;
      }

      .lang-select-bar select {
          padding: 12px 15px;
          background: var(--sidebar-bg);
          color: white;
          border: 1px solid var(--primary-color);
          border-radius: 8px;
          font-size: 16px;
          cursor: pointer;
          outline: none;
      }

      .swap-btn {
          background: var(--primary-color);
          border: none;
          padding: 10px 18px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          font-size: 18px;
          transition: background 0.2s;
      }

      .swap-btn:hover { background: #ffffff; }

      .translation-boxes {
          display: flex;
          gap: 20px;
      }

      .text-area-wrapper {
          flex: 1;
          display: flex;
          flex-direction: column;
      }

      textarea {
          width: 100%;
          height: 220px;
          padding: 15px;
          border-radius: 8px;
          border: 1px solid #555;
          background: rgba(255, 255, 255, 0.05);
          color: white;
          font-size: 16px;
          resize: vertical;
          font-family: inherit;
      }

      textarea:focus {
          outline: 1px solid var(--primary-color);
          background: rgba(255, 255, 255, 0.08);
      }

      .ai-answer-box { 
          background: rgba(255,255,255,0.08); 
          padding: 15px; 
          border-radius: 8px; 
          border-left: 6px solid var(--primary-color); 
          font-size: 16px; 
          line-height: 1.6;
          min-height: 220px;
          word-break: break-word;
      }

      .error-link {
          color: #ff6b6b;
          text-decoration: underline;
          margin-left: 8px;
          font-weight: bold;
      }

      .error-link:hover { color: #ff9999; }

      @media (max-width: 768px) {
          .translation-boxes { flex-direction: column; }
          .lang-select-bar { justify-content: space-between; }
          .lang-select-bar select { width: 40%; }
      }
    </style>
</head>
<body>

    <div class="content-area">
        <div class="top-bar">
            <div class="brand-section">
                <h1>Глобус Переводчик</h1>
            </div>
        </div>

        <main>
            <div class="translator-container">
                <div class="lang-select-bar">
                    <select id="source-lang">
                        <option value="ru" selected>Русский</option>
                        <option value="en">Английский</option>
                        <option value="es">Испанский</option>
                        <option value="de">Немецкий</option>
                        <option value="fr">Французский</option>
                        <option value="zh">Китайский</option>
                    </select>

                    <button class="swap-btn" id="swap-langs">⇆</button>

                    <select id="target-lang">
                        <option value="ru">Русский</option>
                        <option value="en" selected>Английский</option>
                        <option value="es">Испанский</option>
                        <option value="de">Немецкий</option>
                        <option value="fr">Французский</option>
                        <option value="zh">Китайский</option>
                    </select>
                </div>

                <div class="translation-boxes">
                    <div class="text-area-wrapper">
                        <textarea id="input-text" placeholder="Введите текст..."></textarea>
                    </div>
                    <div class="text-area-wrapper">
                        <div class="ai-answer-box" id="output-text">Перевод появится здесь...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const sourceLang = document.getElementById('source-lang');
        const targetLang = document.getElementById('target-lang');
        const swapBtn = document.getElementById('swap-langs');

        let timeoutId = null;

        swapBtn.addEventListener('click', () => {
            const temp = sourceLang.value;
            sourceLang.value = targetLang.value;
            targetLang.value = temp;
            if (inputText.value.trim()) {
                translateText();
            }
        });

        inputText.addEventListener('input', () => {
            clearTimeout(timeoutId);
            if (!inputText.value.trim()) {
                outputText.innerText = 'Перевод появится здесь...';
                return;
            }
            timeoutId = setTimeout(translateText, 500);
        });

        sourceLang.addEventListener('change', () => { if (inputText.value.trim()) translateText(); });
        targetLang.addEventListener('change', () => { if (inputText.value.trim()) translateText(); });

        async function translateText() {
            const text = inputText.value.trim();
            if (!text) return;

            outputText.innerText = 'Перевод...';

            const langPair = `${sourceLang.value}|${targetLang.value}`;
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langPair)}`;

            // Добавляем таймаут 8 секунд, чтобы не застревать
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);

            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);

                if (!response.ok) {
                    showError('Ошибка сервера');
                    return;
                }

                const data = await response.json();

                if (data.responseData && data.responseData.translatedText) {
                    outputText.innerText = data.responseData.translatedText;
                } else {
                    showError('Ошибка при получении перевода');
                }
            } catch (error) {
                clearTimeout(timer);
                showError('Ошибка сети или запроса к API.');
                console.error(error);
            }
        }

        function showError(msg) {
            outputText.innerHTML = `${msg} <a href="https://globus-search.online/help/103.html" target="_blank" class="error-link">Код ошибки: 103</a>`;
        }
    </script>
</body>
</html>
